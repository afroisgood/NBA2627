name: 測試

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 重新建置，確認網頁檔有跟上原始碼
        run: |
          python3 build.py
          git diff --exit-code -- league-power.html dist/ || (echo "::error::src/ 改了但網頁檔沒有重新建置，請執行 python3 build.py 再提交" && exit 1)
      - name: 計算測試
        run: npm test
